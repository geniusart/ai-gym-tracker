name: ironlog

# Production layout (Vultr VDS, /opt/ironlog/server): the box is shared, so
# this project has no Caddy of its own. TLS ends in the host Caddy
# (/etc/caddy/Caddyfile, block "ironlog.egorianin.ru:8001"), which proxies to
# the app on loopback. Ports are published on 127.0.0.1 only: docker bypasses
# ufw, so 0.0.0.0 would expose them to the internet.
services:
  app:
    build: .
    image: ironlog-app
    ports:
      - "${IRONLOG_HTTP_BIND:-127.0.0.1}:${IRONLOG_HTTP_PORT:-8844}:8000"
    volumes:
      - ${IRONLOG_SCHEMAS_DIR:-../schemas}:/schemas:ro
      - ${IRONLOG_DOCS_DIR:-../docs}:/docs:ro
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB=ironlog
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      # Emails allowed to write the shared AI agent instructions.
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
    depends_on:
      - mongo
    mem_limit: 256m
    restart: unless-stopped

  mongo:
    image: mongo:7.0.34
    # The VDS has 1.6 GB RAM for every tenant: cap the WiredTiger cache and
    # the container so mongo does not take the box down.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "${IRONLOG_MONGO_BIND:-127.0.0.1}:${IRONLOG_MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    mem_limit: 512m
    restart: unless-stopped

volumes:
  mongo_data:
