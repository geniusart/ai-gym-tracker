name: IronLog
options:
  bundleIdPrefix: com.ironlog
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"
  createIntermediateGroups: true

schemes:
  IronLog:
    build:
      targets:
        IronLog: all
        IronLogWidgets: all
        IronLogWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IronLogTests
    profile:
      config: Release
    analyze:
      config: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "W88C7J82R5"
    # Kept here rather than in the generated project: these were set through
    # the Xcode UI, and `xcodegen generate` reverted CODE_SIGN_IDENTITY to the
    # legacy "iPhone Developer" string, which no longer resolves -- breaking
    # device builds and archives.
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    PROVISIONING_PROFILE_SPECIFIER: ""
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  IronLog:
    type: application
    platform: iOS
    sources:
      - path: IronLog
    entitlements:
      path: IronLog/IronLog.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Added through the Xcode UI; declared here so a regen keeps it.
        # NOTE: `health-records` is a restricted entitlement and no code in
        # the app reads clinical records -- worth removing before the next
        # App Review submission.
        com.apple.developer.healthkit.access:
          - health-records
    info:
      path: IronLog/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSHealthUpdateUsageDescription: IronLog saves your strength and cycling workouts to Apple Health.
        NSHealthShareUsageDescription: IronLog reads your heart rate during cycling workouts so you can see live BPM and time-in-zone.
        # `processing` and `fetch` were added through the Xcode UI. Declared
        # here so a regen keeps them, but nothing registers a BGTask today,
        # so they are currently inert.
        UIBackgroundModes:
          - workout-processing
          - processing
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.W88C7J82R5.ironlog
        PRODUCT_NAME: IronLog
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    resources:
      - path: IronLog/Resources
    dependencies:
      - target: IronLogWidgets
      - target: IronLogWatch
        embed: true
      - sdk: HealthKit.framework

  IronLogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: IronLogWidgets
      - path: IronLog/Services/RestTimerActivity.swift
      - path: IronLog/Services/CyclingActivity.swift
      - path: IronLog/Shared/WorkoutFormatting.swift
    info:
      path: IronLogWidgets/Info.plist
      properties:
        CFBundleDisplayName: IronLog Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.W88C7J82R5.ironlog.widgets
        PRODUCT_NAME: IronLogWidgets
        SWIFT_EMIT_LOC_STRINGS: true
        SKIP_INSTALL: true

  IronLogWatch:
    type: application
    platform: watchOS
    sources:
      - path: IronLogWatch
    entitlements:
      path: IronLogWatch/IronLogWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Both added through the Xcode UI -- see the note on the iOS target.
        com.apple.developer.healthkit.access:
          - health-records
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: IronLogWatch/Info.plist
      properties:
        WKApplication: true
        # Declares this watch app is the companion for the iPhone app.
        # iOS uses this to surface "IronLog" in the Watch app's
        # "Available Apps" list and auto-install it on first iPhone run.
        WKCompanionAppBundleIdentifier: com.W88C7J82R5.ironlog
        NSHealthShareUsageDescription: IronLog Watch reads heart rate and active energy during workouts to show live training metrics.
        NSHealthUpdateUsageDescription: IronLog Watch saves completed workout sessions to Apple Health.
        WKBackgroundModes:
          - workout-processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.W88C7J82R5.ironlog.watch
        PRODUCT_NAME: IronLogWatch
        SWIFT_EMIT_LOC_STRINGS: true
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: HealthKit.framework

  IronLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IronLogTests
    dependencies:
      - target: IronLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.W88C7J82R5.ironlog.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IronLog.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/IronLog"
        BUNDLE_LOADER: "$(TEST_HOST)"
